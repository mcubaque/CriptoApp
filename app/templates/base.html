<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Cripto App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/alpine.min.js') }}"></script>
  <script>
    // Abre la vista "Python Tutor" en una pestaña nueva mediante un <form>
    // independiente, creado al vuelo -- HTMX intercepta el submit de
    // cualquier botón dentro de un <form hx-post>, ignorando formaction/
    // formtarget, así que un botón submit normal nunca llega a navegar.
    function openTutorTab(triggerEl, url) {
      const sourceForm = triggerEl.closest('form');
      const tutorForm = document.createElement('form');
      tutorForm.method = 'POST';
      tutorForm.action = url;
      tutorForm.target = '_blank';
      tutorForm.style.display = 'none';
      new FormData(sourceForm).forEach((value, key) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = value;
        tutorForm.appendChild(input);
      });
      document.body.appendChild(tutorForm);
      tutorForm.submit();
      document.body.removeChild(tutorForm);
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">🔐 Cripto App</a>
    <nav>
      <a href="{{ url_for('classical.index') }}">Clásica</a>
      <a href="{{ url_for('symmetric_modern.index') }}">Simétrica moderna</a>
      <a href="{{ url_for('asymmetric.index') }}">Asimétrica</a>
      <a href="{{ url_for('pki.index') }}">PKI</a>
      <a href="{{ url_for('authentication.index') }}">Autenticación</a>
      <a href="{{ url_for('history.index') }}">Historial</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
